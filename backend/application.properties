# Configurações de conexão com o XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/agrilink_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

ai.service.url=http://localhost:5001

# Tamanhos maximos para lidar com Base64 de imagens grandes
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
